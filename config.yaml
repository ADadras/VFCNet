# VFCNet Configuration
# Best hyperparameters from ablation study
#
# IMPORTANT: Update the paths section before running training or evaluation

paths:
  # Dataset paths (REQUIRED - update these to your local paths)
  kupcp_root: /path/to/kupcp
  picd_root: /path/to/PICD
  cache_root: /path/to/cache/saliency_gvf           # KUPCP saliency cache
  picd_cache_root: /path/to/PICD/cache_saliency_gvf  # PICD saliency cache
  
  # DINOv3 model paths (REQUIRED)
  dino_repo: /path/to/models/dinov3  # Clone from facebookresearch/dinov2
  dino_model: dinov3_vitb16
  dino_weights: /path/to/models/dinov3_vitb16_pretrain.pth
  
  # Output paths
  output_dir: ./output
  checkpoint_dir: ./output/checkpoints

gvf:
  # Diffusion parameters (from Table 4)
  mu: 0.15          # Regularization weight
  iterations: 10    # Fewer iterations = better (10 > 30 > 50)
  beta: 0.1         # Saliency gradient force strength
  edge_source: intensity  # intensity | sobel | canny
  gvf_size: 56      # Output GVF spatial resolution

model:
  # DINOv3 backbone
  embed_dim: 768    # ViT-B/16
  backbone_trainable: true  # Unfreezing helps +4.8%
  
  # Multi-level feature extraction
  low_level_blocks: [2, 3]
  mid_level_blocks: [5, 6]
  high_level_blocks: [10, 11]
  high_level_dropout: 0.3
  
  # GVF feature extraction (from Table 5)
  vf_dim: 128
  gvf_scales: [1, 2, 4]  # Multi-scale pyramid
  use_divergence: true   # -8.6% if removed
  use_curl: true         # -4.1% if removed
  use_magnitude: true    # -7.3% if removed
  pooling: avg
  
  # Attention and classifier
  num_attention_heads: 4
  hidden_dim: 512
  dropout: 0.3
  num_classes: 9

training:
  batch_size: 16
  learning_rate: 5.0e-5
  weight_decay: 0.01
  epochs: 30
  
  # Loss function
  loss_type: bce
  
  # Training options
  use_amp: true
  num_workers: 4
